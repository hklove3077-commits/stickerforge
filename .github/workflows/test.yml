name: StickerForge tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow scipy imagehash
      - name: Check Python syntax
        run: python -m compileall -q skills/stickerforge/scripts skills/stickerforge/tests
      - name: Validate installer syntax
        run: bash -n install.sh
      - name: Run synthetic image and pilot tests
        run: python skills/stickerforge/tests/run_tests.py
